apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wrench-execucao-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      {{- if .Values.gateway.certificateArn }}
      sectionName: https
      {{- end }}
  hostnames: ['{{ .Values.httpRoute.hostname }}']
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix }}
      backendRefs:
        - name: wrench-execucao-svc
          port: {{ .Values.containerPort }}

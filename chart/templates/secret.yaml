apiVersion: v1
kind: Secret
metadata:
  name: wrench-execucao-config
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  ASPNETCORE_ENVIRONMENT: Production
  AWS__Region: {{ .Values.aws.region | quote }}
  Dynamo__Execucao: {{ .Values.dynamo.execucaoTable | quote }}
  Dynamo__Outbox: {{ .Values.dynamo.outboxTable | quote }}
  Dynamo__Idempotencia: {{ .Values.dynamo.idempotenciaTable | quote }}
  Sns__TopicArn: {{ .Values.sns.topicArn | quote }}
  JwtOptions__Secret: {{ required "jwt.secret é obrigatório (--set jwt.secret=...)" .Values.jwt.secret | quote }}
  JwtOptions__Issuer: {{ .Values.jwt.issuer | quote }}
  JwtOptions__Audience: {{ .Values.jwt.audience | quote }}
  Execucao__PermitirFalhaForcada: {{ .Values.execucao.permitirFalhaForcada | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  # Nome próprio do serviço: o chart do os-service já cria "newrelic-credentials" neste namespace.
  name: wrench-execucao-newrelic
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.newRelic.otlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.newRelic.otlpProtocol | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ printf "api-key=%s" .Values.newRelic.licenseKey | quote }}

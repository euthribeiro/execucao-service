name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  packages: read

jobs:
  # Build, testes, gate de cobertura, SonarCloud e validação do chart vivem no workflow
  # reutilizável do infra-k8s, compartilhado pelos três microsserviços da Fase 4.
  build-test:
    uses: euthribeiro/infra-k8s/.github/workflows/dotnet-service-ci.yml@master
    secrets: inherit
    with:
      solution: wrench.execucao.sln
      cobertura_minima: 80
      cobertura_assembly_filtros: '+wrench.execucao.*;-*.tests'
      cobertura_classe_filtros: '-Program;-*.Program'
      sonar_project_key: euthribeiro_execucao-service
      sonar_organization: euthribeiro
      sonar_exclusions: '**/obj/**,**/bin/**,**/Program.cs'
      helm_chart: chart
      helm_lint_args: '--set jwt.secret=ci'

  deploy-producao:
    if: github.ref == 'refs/heads/main'
    needs: build-test
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: 'production'
      hostname: 'api.bgt3.com.br'
      release_name: 'wrench-execucao'
